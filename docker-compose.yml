# MediCall AI — deploy stack (G6-Q10, spec-deploy-q10.md).
# Services: postgres (pgvector) + backend + frontend. The cache client
# (backend/app/db/redis.py) has ZERO callers — redis was dropped from the stack
# (Q1=A1); the pip pin + Upstash env vars are kept as a documented stub.
# backend builds from the REPO ROOT (context: .) so docker compose and Railway
# share one Dockerfile (Q2=A1); the root .dockerignore keeps the context lean.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "0.0.0.0:8001:8000"
    environment:
      # asyncpg scheme REQUIRED by create_async_engine (postgres.py).
      - DATABASE_URL=postgresql+asyncpg://medicall_app:medicall_app@postgres:5432/medicall
      - FRONTEND_URL=${FRONTEND_URL}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-dev-secret-change-me}
      - WEBHOOK_SERVICE_TOKEN=${WEBHOOK_SERVICE_TOKEN:-dev-service-token}
      - DEBUG=true
      - LOG_LEVEL=debug
      - ENVIRONMENT=development
      # Payments (G6-Q5, spec-payments.md): keys gate live gateway dispatch
      # (501 without); webhook secrets verify per-gateway signatures.
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - PHONEPE_MERCHANT_ID=${PHONEPE_MERCHANT_ID:-}
      - PHONEPE_SALT_KEY=${PHONEPE_SALT_KEY:-}
      - PHONEPE_SALT_INDEX=${PHONEPE_SALT_INDEX:-1}
      - CASHFREE_APP_ID=${CASHFREE_APP_ID:-}
      - CASHFREE_SECRET_KEY=${CASHFREE_SECRET_KEY:-}
      - CASHFREE_WEBHOOK_SECRET=${CASHFREE_WEBHOOK_SECRET:-}
      - PAYMENT_LINK_BASE_URL=${PAYMENT_LINK_BASE_URL:-http://localhost:8001}
      # Notifications (G6-Q8, spec-notifications-q8.md): channel keys gate
      # live dispatch (501 without); empty = hooks record status=queued.
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN:-}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID:-}
      - KNOWLARITY_SMS_TOKEN=${KNOWLARITY_SMS_TOKEN:-}
      - KNOWLARITY_SMS_SENDER_ID=${KNOWLARITY_SMS_SENDER_ID:-}
      - MSG91_AUTH_KEY=${MSG91_AUTH_KEY:-}
      - MSG91_SENDER_ID=${MSG91_SENDER_ID:-}
      - MSG91_ROUTE=${MSG91_ROUTE:-4}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@medicall.in}
      - FCM_SERVER_KEY=${FCM_SERVER_KEY:-}
      - FCM_SENDER_ID=${FCM_SENDER_ID:-}
      # DPDP Act 2023 (G6-Q2 -> G6-Q10): DATA_RESIDENCY_REGION is PINNED to
      # "in" (documented posture — provider home is Railway asia-southeast1
      # "nearest available" + frontend at Vercel bom1/Mumbai, see
      # docs/DEPLOYMENT.md). Retention days + DPO stay env-overridable.
      - DATA_RESIDENCY_REGION=in
      - DPDP_BREACH_NOTIFICATION_HOURS=${DPDP_BREACH_NOTIFICATION_HOURS:-72}
      - RETENTION_CALLS_DAYS=${RETENTION_CALLS_DAYS:-365}
      - RETENTION_RECORDINGS_DAYS=${RETENTION_RECORDINGS_DAYS:-365}
      - RETENTION_NOTIFICATIONS_DAYS=${RETENTION_NOTIFICATIONS_DAYS:-180}
      - RETENTION_AUDIT_DAYS=${RETENTION_AUDIT_DAYS:-2190}
      - DPO_NAME=${DPO_NAME:-}
      - DPO_EMAIL=${DPO_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medicall-local
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${FRONTEND_URL}
      - NEXT_PUBLIC_ENVIRONMENT=development
      - NEXT_PUBLIC_DEBUG=true
    depends_on:
      - backend
    networks:
      - medicall-local
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=medicall
      - POSTGRES_PASSWORD=medicall
      - POSTGRES_DB=medicall
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - medicall-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicall -d medicall"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:

networks:
  medicall-local:
    driver: bridge