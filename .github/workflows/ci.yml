# MediCall AI — Docker/CI integration (g-ci phase)
# 3 jobs: backend (stdlib suites + py_compile + ruff), frontend (npm ci +
# lint + build), stack (docker compose up + HTTP smoke + teardown).
# The stack job proves the running systems match docs/uml/03-api-contracts.md;
# live provider round-trips (Deepgram/ElevenLabs/OpenAI, LiveKit rooms) stay
# behind secrets in a later stage.

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (stdlib suites + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --no-cache-dir -r backend/requirements.txt
      - name: Run all stdlib suites + py_compile
        working-directory: backend
        run: |
          for t in tests/test_*.py; do echo "== $t =="; python3 "$t" || exit 1; done
          python3 -m py_compile main.py app/api/*.py app/models/*.py app/db/*.py app/services/*.py app/schemas/*.py
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

  frontend:
    name: Frontend (npm ci + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  stack:
    name: Stack (docker compose + HTTP smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose up (backend + frontend + pgvector + redis)
        run: docker compose up -d --build
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8001/health && break || sleep 2
          done
      - name: HTTP smoke (03-api-contracts)
        run: python3 backend/scripts/smoke_api.py http://localhost:8001
      - name: Teardown
        run: docker compose down -v